name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  CUSTOM_DOMAIN: "www.maafinn.com"
  ENABLE_HEADERS: "0"
  CNAME_DOMAIN: "www.maafinn.com"
  NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
  NEXT_PUBLIC_BUILD_TIME: ${{ github.run_started_at }}
  NEXT_PUBLIC_YM_ID: ${{ secrets.YM_ID }}
  NEXT_PUBLIC_API_BASE: "https://maafinn-api.maafinn.workers.dev"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Собираем сайт (c output: "export" в next.config.js это кладёт сайт в out/)
      - name: Next.js build
        run: npm run build

      # Генерим sitemap.xml и robots.txt в out/ (по next-sitemap.config.cjs)
      - name: Generate sitemap & robots
        run: npm run sitemap

      # (опционально) Положим CNAME
      - if: ${{ env.CNAME_DOMAIN != '' }}
        run: echo "${{ env.CNAME_DOMAIN }}" > out/CNAME

      # Быстрые проверки, чтобы не уехать без файлов
      - name: Verify sitemap/robots present
        run: |
          ls -la out | grep -E 'sitemap|robots' || true
          test -f out/sitemap.xml
          test -f out/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
