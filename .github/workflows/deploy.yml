name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  CUSTOM_DOMAIN: "www.maafinn.com"
  ENABLE_HEADERS: "0"
  CNAME_DOMAIN: "www.maafinn.com"
  NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
  NEXT_PUBLIC_BUILD_TIME: ${{ github.run_started_at }}
  NEXT_PUBLIC_YM_ID: ${{ secrets.YM_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx next build
      - run: npx next export
      - run: mkdir -p out
      - run: test -f out/index.html || { echo "No out/index.html"; exit 1; }
      - if: ${{ env.CNAME_DOMAIN != '' }}
        run: echo "${{ env.CNAME_DOMAIN }}" > out/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
